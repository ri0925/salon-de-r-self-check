<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon de R - SELF CHECK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #faf9f6;
      font-family: 'Noto Serif JP', serif;
      color: #4a4641;
      line-height: 1.8;
      padding: 40px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: #6e675f;
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #9c958c;
      margin-top: 4px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border: 1px solid #dcd7cf;
      border-radius: 18px;
      padding: 36px 24px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.25em;
      color: #6e675f;
      margin-bottom: 8px;
    }

    .card-lead {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #55504a;
      margin-bottom: 4px;
    }

    .card-instruction {
      text-align: center;
      font-size: 11px;
      color: #9c958c;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }

    .divider {
      border: none;
      height: 1px;
      background-color: #eae6df;
      margin: 20px 0 24px;
    }

    .section-title {
      font-size: 12.5px;
      color: #6e675f;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .section-category {
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.3em;
      color: #8c8479;
      margin-bottom: 20px;
    }

    .check-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .check-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .check-item input {
      display: none;
    }

    .custom-checkbox {
      width: 17px;
      height: 17px;
      border: 1px solid #c2bbb0;
      border-radius: 4px;
      margin-right: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      transition: all 0.2s ease;
    }

    .custom-checkbox::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg) scale(0);
      margin-bottom: 2px;
      transition: transform 0.2s ease;
    }

    .check-item input:checked + .custom-checkbox {
      background-color: #7b746a;
      border-color: #7b746a;
    }

    .check-item input:checked + .custom-checkbox::after {
      transform: rotate(45deg) scale(1);
    }

    .check-text {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #55504a;
    }

    .notice {
      font-size: 9px;
      color: #a8a196;
      line-height: 1.6;
      margin-top: 28px;
      margin-bottom: 18px;
      letter-spacing: 0.03em;
    }

    .submit-btn {
      width: 100%;
      background: #ffffff;
      border: 1px solid #aba398;
      border-radius: 999px;
      padding: 13px 0;
      font-family: 'Noto Serif JP', serif;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: #4a4641;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .submit-btn:active {
      background-color: #f5f3ef;
      border-color: #7a7369;
    }

    .footer-logo {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #8c8479;
      margin-top: 24px;
    }

    /* 診断結果モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 37, 33, 0.45);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 999;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: #ffffff;
      border: 1px solid #dcd7cf;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      transform: translateY(15px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .result-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: #9c958c;
      margin-bottom: 6px;
    }

    .result-title {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: #55504a;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .result-desc {
      font-size: 12px;
      color: #6e675f;
      line-height: 1.9;
      text-align: left;
      background: #faf8f5;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
      letter-spacing: 0.03em;
    }

    .close-btn {
      width: 100%;
      background: #7b746a;
      border: none;
      color: #fff;
      border-radius: 999px;
      padding: 12px 0;
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-logo">
    <div class="brand-title">Salon de R</div>
    <div class="brand-sub">肌と頭皮を、丁寧に整える。</div>
  </div>

  <div class="card">
    <div class="card-title">SELF CHECK</div>
    <div class="card-lead">今、あなたが整えたいのは？</div>
    <div class="card-instruction">当てはまる項目にチェックしてください</div>

    <hr class="divider">

    <!-- ① 美肌ケア -->
    <div class="section-title">① 水光美肌ケアチェック</div>
    <div class="section-category">SKIN CARE</div>
    <div class="check-list">
      <label class="check-item">
        <input type="checkbox" name="skin" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">肌のハリや弾力が気になってきた</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="skin" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">以前より肌のツヤがなくなった</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="skin" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">乾燥しやすく、化粧ノリが悪い</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="skin" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">毛穴やキメの乱れが気になる</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="skin" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">顔全体が疲れて見える</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="skin" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">年齢とともに肌質の変化を感じる</span>
      </label>
    </div>

    <hr class="divider" style="margin-top: 26px;">

    <!-- ② 頭皮ケア -->
    <div class="section-title">② 水光頭皮ケアチェック</div>
    <div class="section-category">SCALP CARE</div>
    <div class="check-list">
      <label class="check-item">
        <input type="checkbox" name="scalp" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">髪のボリュームが気になってきた</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="scalp" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">分け目や頭頂部が目立つように感じる</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="scalp" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">髪のハリ・コシが気になる</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="scalp" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">頭皮の乾燥や硬さが気になる</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="scalp" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">頭皮環境を整えたい</span>
      </label>
      <label class="check-item">
        <input type="checkbox" name="scalp" value="1">
        <span class="custom-checkbox"></span>
        <span class="check-text">将来のために頭皮ケアを始めたい</span>
      </label>
    </div>

    <div class="notice">
      ※医療的な診断ではなく、メニュー選びの目安です。チェック内容は保存・送信されません。
    </div>

    <button type="button" class="submit-btn" id="check-btn">チェック結果を見る</button>
  </div>

  <div class="footer-logo">Salon de R</div>

  <!-- 診断結果ポップアップ -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-content">
      <div class="result-tag">RECOMMENDED MENU</div>
      <div class="result-title" id="result-title">水光美肌コース</div>
      <div class="result-desc" id="result-desc">説明文</div>
      <button type="button" class="close-btn" id="close-btn">閉じる</button>
    </div>
  </div>

  <script>
    const checkBtn = document.getElementById('check-btn');
    const modal = document.getElementById('result-modal');
    const closeBtn = document.getElementById('close-btn');
    const titleEl = document.getElementById('result-title');
    const descEl = document.getElementById('result-desc');

    checkBtn.addEventListener('click', () => {
      const skinChecks = document.querySelectorAll('input[name="skin"]:checked').length;
      const scalpChecks = document.querySelectorAll('input[name="scalp"]:checked').length;

      if (skinChecks === 0 && scalpChecks === 0) {
        titleEl.textContent = 'チェック項目をお選びください';
        descEl.textContent = '当てはまるお悩みにチェックを入れてから、もう一度「チェック結果を見る」ボタンを押してください。';
      } else if (skinChecks > 0 && scalpChecks > 0 && Math.abs(skinChecks - scalpChecks) <= 1) {
        titleEl.innerHTML = '水光トータルケア<br>（美肌 × 頭皮コース）';
        descEl.textContent = 'お肌のツヤやハリ感、そして頭皮のコンディション双方に整え時が訪れています。肌と頭皮は一枚の皮で繋がっているため、同時にアプローチすることで本来の瑞々しさとリフトアップ感をより実感していただけます。';
      } else if (skinChecks >= scalpChecks) {
        titleEl.textContent = '水光美肌ケアコース';
        descEl.textContent = '肌の水分・油分バランスやハリ・キメの乱れを整えるケアが最適です。深部までうるおいを行き渡らせ、内側から発光するようなみずみずしい艶肌へと導くトリートメントをおすすめいたします。';
      } else {
        titleEl.textContent = '水光頭皮スパケアコース';
        descEl.textContent = '頭皮の柔軟性や巡りを整え、健やかな毛髪の土台をつくる頭皮集中ケアが最適です。乾燥や硬さをほぐし、根本から立ち上がるような豊かなハリ・コシを育てるメニューをおすすめいたします。';
      }

      modal.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
